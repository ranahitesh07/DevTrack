services:
  postgres:
    image: postgres:16
    container_name: devtrack-postgres
    environment:
      POSTGRES_DB: devtrack
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: devtrack-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: devtrack-frontend
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  postgres_data: